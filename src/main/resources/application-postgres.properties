# Active with --spring.profiles.active=postgres (used by docker-compose.yml).
# Every value can be overridden through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:health}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:health}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
