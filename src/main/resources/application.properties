spring.application.name=health-monitor-api
spring.datasource.url=jdbc:h2:mem:healthdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
healthmonitor.simulator.enabled=false

# --- JWT (HS256). Override the secret with JWT_SECRET in production. ---
healthmonitor.jwt.secret=${JWT_SECRET:dev-only-hs256-secret-change-me-0123456789abcdef0123456789abcdef}
healthmonitor.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}

# --- Alert thresholds (defaults; per-patient overrides live in the database) ---
healthmonitor.alert.heart-rate-min=50
healthmonitor.alert.heart-rate-max=120
healthmonitor.alert.spo2-min=92
healthmonitor.alert.temperature-max=38.0
healthmonitor.alert.cooldown-seconds=60

# --- Telegram alerts: set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to activate ---
healthmonitor.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
healthmonitor.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
